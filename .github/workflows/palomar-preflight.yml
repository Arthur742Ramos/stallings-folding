name: Palomar preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@f49b4f29aa458fc70c3a4c8cadca9312adbdc559
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: f49b4f29aa458fc70c3a4c8cadca9312adbdc559
      request_id: stallings001
      mode: full
      execution_profile: ""
      options: "{}"

  render-profile:
    runs-on: ubuntu-24.04
    outputs:
      labels: ${{ steps.resolve.outputs.labels }}
      render_timeout: ${{ steps.resolve.outputs.render_timeout }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b
        with:
          repository: PalomarRegistry/PalomarSubmission
          ref: f49b4f29aa458fc70c3a4c8cadca9312adbdc559
          persist-credentials: false
          path: pipeline
      - id: resolve
        env:
          PALOMAR_EXECUTION_PROFILE: ""
        run: python3 pipeline/scripts/verification_profile.py --resolve

  render:
    needs: render-profile
    runs-on: ${{ fromJSON(needs.render-profile.outputs.labels) }}
    timeout-minutes: ${{ fromJSON(needs.render-profile.outputs.render_timeout) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Checkout trusted Palomar renderer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: PalomarRegistry/PalomarSubmission
          ref: f49b4f29aa458fc70c3a4c8cadca9312adbdc559
          path: pipeline
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.10"

      - name: Install pinned renderer dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --no-deps -r pipeline/requirements.txt

      - name: Bind immutable candidate and Challenge digest
        id: prepare
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          PROJECT_PATH: ""
          CHALLENGE_PATH: Challenge.lean
          SOLUTION_PATH: Solution.lean
          COMPARATOR_CONFIG_PATH: comparator.json
          LAKEFILE_PATH: lakefile.toml
          LEAN_TOOLCHAIN_PATH: lean-toolchain
        working-directory: pipeline
        run: |
          CHALLENGE_SHA256="$(sha256sum "$GITHUB_WORKSPACE/$CHALLENGE_PATH" | cut -d' ' -f1)"
          python -m scripts.render_challenge prepare \
            --repository "$SOURCE_REPOSITORY" \
            --commit "$SOURCE_COMMIT" \
            --challenge-sha256 "$CHALLENGE_SHA256" \
            --project-path "$PROJECT_PATH" \
            --challenge-path "$CHALLENGE_PATH" \
            --solution-path "$SOLUTION_PATH" \
            --comparator-config-path "$COMPARATOR_CONFIG_PATH" \
            --lakefile-path "$LAKEFILE_PATH" \
            --lean-toolchain-path "$LEAN_TOOLCHAIN_PATH" \
            --work-dir "$RUNNER_TEMP/palomar-render" \
            --output "$RUNNER_TEMP/palomar-render/report.json"

      - name: Install pinned elan
        if: steps.prepare.outputs.ready == 'true'
        run: |
          python3 pipeline/scripts/trusted_download.py \
            --url https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/elan.tar.gz" \
            --sha256 df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
          mkdir "$RUNNER_TEMP/elan"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan"
          "$RUNNER_TEMP/elan/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install candidate Lean toolchain
        if: steps.prepare.outputs.ready == 'true'
        env:
          LEAN_TOOLCHAIN: ${{ steps.prepare.outputs.lean_toolchain }}
        run: elan toolchain install "$LEAN_TOOLCHAIN"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        if: steps.prepare.outputs.ready == 'true'
        with:
          go-version: "1.24.0"

      - name: Build pinned Landrun
        if: steps.prepare.outputs.ready == 'true'
        run: CGO_ENABLED=0 go install github.com/zouuup/landrun/cmd/landrun@811cfff51ceaf3d9843708aa6d22e9b84ccac8b4

      - name: Build bubblewrap
        if: steps.prepare.outputs.ready == 'true'
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq meson ninja-build libcap-dev pkg-config >/dev/null
          echo "PALOMAR_BWRAP=$(pipeline/scripts/install_bwrap.sh "$RUNNER_TEMP/bwrap-bin")" >> "$GITHUB_ENV"

      - name: Build, audit, and render the Challenge under Landrun
        if: steps.prepare.outputs.ready == 'true'
        working-directory: pipeline
        run: |
          python -m scripts.render_challenge execute \
            --work-dir "$RUNNER_TEMP/palomar-render" \
            --output "$RUNNER_TEMP/palomar-render/report.json" \
            --landrun "$(go env GOPATH)/bin/landrun" \
            --bwrap "$PALOMAR_BWRAP" \
            --renderer-commit f49b4f29aa458fc70c3a4c8cadca9312adbdc559 \
            --landrun-commit 811cfff51ceaf3d9843708aa6d22e9b84ccac8b4 \
            --workflow-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Upload bounded render result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: challenge-render-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/palomar-render/report.json
            ${{ runner.temp }}/palomar-render/result
          if-no-files-found: error
          retention-days: 30

      - name: Require a successful render
        if: always()
        env:
          REPORT: ${{ runner.temp }}/palomar-render/report.json
        run: python3 -c 'import json, os, pathlib, sys; p = pathlib.Path(os.environ["REPORT"]); sys.exit(0 if json.loads(p.read_text())["status"] == "pass" else 1)'
