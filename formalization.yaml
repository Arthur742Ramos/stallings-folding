# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Verified finite automata for finitely generated subgroups of F₂"
  description: >-
    Source-based formalization of the classical Stallings finite-graph
    recognition theorem. It gives an executable finite folding construction
    for every finite list of words in the rank-two free group, with exact
    subgroup-membership correctness. The least deterministic fold congruence
    is computed by finite exhaustive search; there is no complexity claim or
    implementation of core trimming, subgroup bases, intersections, or index
    algorithms.
  authors:
    - "Arthur Freitas Ramos"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Arthur Freitas Ramos"

classification:
  arxiv: ["math.GR", "math.LO"]
  msc2020: ["20E05", "68Q45", "03B35"]

sources:
  - title: "Topology of Finite Graphs"
    authors: ["John R. Stallings"]
    id: "https://doi.org/10.1007/BF02095993"
    type: "paper"
    location: "Inventiones Mathematicae 71 (1983), 551–565"
    relationship: "formalizes"
    note: >-
      Primary mathematical source for representing finitely generated
      subgroups by finite labelled graphs and folding. This development proves
      the finite-recognizer result for F₂ with an exhaustive least-congruence
      implementation; it does not formalize the paper's core trimming or its
      other algorithmic consequences.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Stallings foldings and the subgroup structure of free groups"
    authors: ["Ilya Kapovich", "Alexei Myasnikov"]
    id: "https://doi.org/10.1006/jabr.2001.9033"
    type: "paper"
    location: "Journal of Algebra 248 (2002), 608–668"
    relationship: "background"
    note: >-
      Later computational treatment documenting the role of subgroup graphs
      and folding in algorithmic subgroup theory. Cited to ground the
      algorithmic context, not as a source of code or a claim of new results.
    license: "unknown"
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4/tree/db584cd6d46c92f209a44c0f1c829460d327499d"
    relationship: "builds-on"
    note: >-
      Immutable source project mathlib4 at commit
      db584cd6d46c92f209a44c0f1c829460d327499d; reuses
      Mathlib/GroupTheory/FreeGroup/Reduce.lean and its imported free-group
      definitions for FreeGroup (Fin 2), word evaluation, canonical reduced
      representatives, and the quotient soundness results. No earlier
      formalization project or same-repository subproject is vendored. The new
      selected result is Stallings.folded_recognizer_exists: a finite folded
      automaton recognizing an arbitrary finite generating list.

status:
  scope: >-
    For a finite list S of signed words over two generators, constructs the
    finite flower graph, computes the intersection of all Boolean fold
    congruences, and returns a partial deterministic inverse automaton. Proves
    that its based-loop subgroup is exactly the subgroup generated by S and
    that its executable traversal of FreeGroup.toWord decides membership.
    The reference implementation is exhaustive rather than optimized. It
    retains auxiliary isolated states; core trimming, subgroup bases and rank,
    finite-index and index computation, subgroup intersections, and Hall-type
    finite-cover extensions are outside the formalized scope.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: ["GPT-6 Codex"]
      framework: "Codex with Lean 4.33.0 and pinned Mathlib"
      tool_setup: >-
        Lean 4.33.0, Lake, and Mathlib pinned at
        db584cd6d46c92f209a44c0f1c829460d327499d; proof and metadata work in
        the local Windows development environment.
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local Windows host"
      prompting_notes: "Human-directed formalization scope and iterative proof development."
  spend_usd: "subscription-based"
  notes: >-
    AI-assisted Lean development with human-directed scope. The selected
    theorem is proved in Solution.lean; Challenge.lean contains the standalone
    Mathlib-only statement and its deliberate Comparator placeholder.

fidelity:
  divergences: >-
    The mathematical output is a finite inverse automaton with the same
    subgroup membership semantics as Stallings folding. For a compact reference
    implementation, folding is computed as the least deterministic
    equivalence relation over a finite state set instead of a sequence of
    local union-find folds. The construction does not trim the core and does
    not formalize the paper's basis, intersection, finite-index, or covering
    extensions.

review:
  status: "self-assessed"
  reviewers: ["none"]
  notes: >-
    The Lean development and closed Challenge statement were self-audited.
    No independent mathematical review, Palomar mechanical verification,
    hosted renderer replay, intake, or registration has been completed.

alignment:
  namespace: "Stallings"
  statements:
    - source: "Finite labelled graph recognition of finitely generated subgroups; Stallings (1983)"
      lean: "Stallings.folded_recognizer_exists"
      module: "Solution"
      status: "proved"
      note: >-
        The witness is produced by foldWords. The proof establishes equality
        between its based-loop subgroup and the subgroup generated by the input
        list, then applies the verified canonical-word traversal theorem.

acknowledgements: >-
  John R. Stallings for the finite-graph folding framework; Mathlib contributors
  for the free-group quotient and reduced-word normal form; and the Lean and
  Palomar verification communities.
